# The pinned game-record corpus.
#
# Third-party records are not copied into this repository. Each entry names a file
# inside a pinned submodule by path, git blob id and SHA-256; the harness reads the
# bytes from that submodule's object store at its locked commit. A record cannot
# change without this file changing, and no record is redistributed from here.
#
# Records are fed to every source as stored, with CRLF folded to LF - but for
# cwmtt's records in the official client's export form, whose moves name their
# board twice (`(0T1)Pe2(0T1)e3`): every source reads those converted to the
# notation specification's 5dpgn (oracle_harness/export_form.py; the CHECKPOINT 3
# ruling), and their entries pin the converted text too.
#
#   board    the variant the record declares, exactly: its Board header, or its
#            Variant header when it has no Board header (ftxi reads one in place
#            of the other); empty when it has neither
#   fen      true when the record sets up its own position with 5DFEN boards. Such
#            a record counts towards no named variant: whatever its headers say,
#            the gate files it under "(custom positions)" - as it does a record
#            whose board is a custom set-up ("Custom...", "Even", "Odd")
#   tier     the cheapest gate tier that runs the record (commit | nightly)
#   also_at  other pinned locations holding the identical blob
#   converted  only for a record of cwmtt's in the export form: the SHA-256 of the
#            converted text every source reads (`verify` prints it), or
#            "unsupported" where a move of it has no form in the notation
#            specification - then no source is given the record, and every one
#            reports it unsupported (reason export_form)
#
# This is a seed corpus: the .5dpgn test records the pinned projects ship (not
# cwmtt's tests in its own .tn format, nor the games embedded in 5d-chess-js's
# JavaScript tests), the sample games of the notation repository, and a few records
# written here. It spans a dozen board variants, but it is small, and most of it
# was written as test cases rather than played as games. No oracle reads all of
# it: each knows only some variants and some notation.
#
# Adding records: `python oracles/harness.py corpus --unlisted` prints a stub for
# every .5dpgn file in a pinned source that is neither listed nor excluded here;
# records of our own go under oracles/corpus/records/ with source = "local" (that
# directory is exempt from line-ending conversion, see .gitattributes, because a
# record is pinned by the hash of its bytes).
# Every record states the licence it is used under.
schema = 1

