licence_file = "LICENSE"
licence_sha256 = "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986"
summary = "Haskell rules implementation and the original hypercuboid mate search, with a naive search beside it"
used_as = "Built from an export of the pinned commit with the pinned GHC. Its counts, and how far it replays a record, come from its stock CLI (`cwmtt count`), unmodified. Beside it runs oracles/drivers/cwmtt, a state driver of the harness's own compiled against the same modules with the same flags (it calls them and copies nothing), which replays the record and reports, at every position, the boards cwmtt holds and the side to move - the CLI has no command for either; the adapter pairs the two only where they read and replayed the record alike."
lineage = "cwmtt"
lineage_note = "Read at the pin (2026-11-01): its LICENSE (GPL-3.0; cwmtt.cabal says BSD3, author Toby Cathcart Burn), README and code; no NOTICE or credits naming another implementation. The hypercuboid method originates here (Game/Chess/TimeTravel/FastCheckmate.lhs); its 5dpgn reader follows the notation specification (PGNParser.hs: 'notation described by https://github.com/adri326/5dchess-notation'), written in Haskell. Its own lineage."
dependency_names = ["cwmtt", "Game.Chess.TimeTravel"]
notes = [
    "No z3 in the program at this commit. Upstream removed the z3-based search in 65e1bf9 (2023-03-26) because it was slower than the plain hypercuboid search; the design spec's 'Haskell and z3' describes the older tree. Its README still mentions z3 and its stack.yaml still lists the z3 package, but cwmtt.cabal depends only on base and containers, so GHC alone builds it.",
    "Its CLI reports whether a legal action exists, not why none does: it cannot tell checkmate from stalemate, and it has no check verdict.",
    "A Board header it does not know - or that its parser does not reach - is silently replayed on the Standard layout, 5DFEN boards are skipped and a Promotions header is never read; the adapter refuses such records instead of trusting the answer.",
    "Its parser stops without failing at the first thing it does not read (an annotation glyph, castling, a variation) and replays what it had. When that leaves the last action half read, the adapter reports the record as unsupported from there instead of passing the fragment's fate off as a verdict.",
]

[repo.chessin5d]
role = "oracle"
tier = "nightly"
upstream = "5d-chess/5d-chess-js"
url = "https://gitlab.com/5d-chess/5d-chess-js.git"
submodule = "oracle-chessin5d"
path = "oracles/third_party/chessin5d"
commit = "ee403c80e8c132fc4d168f5b99ddd9b8fe5cc17b"
tree = "f3997f396da0ece00fff6cfc7e65743ec979305e"
ref = "master"
committed = "2022-06-15"
licence = "AGPL-3.0-or-later"
licence_file = "LICENSE"
licence_sha256 = "6f551a3f45c2c2235ec9b9e2d93c5896babab36caed027781b3e90df90876097"
summary = "JavaScript rules library behind Chess in 5D (chessin5d.net): the most independent of the three implementations"
used_as = "Exported at the pinned commit; its three runtime npm dependencies are installed from its own package-lock.json. Queried through oracles/drivers/chessin5d, in a separate Node process per record."
lineage = "chessin5d"
lineage_note = "Read at the pin (2026-11-01; corrected 2026-11-02): its LICENSE (AGPL-3.0), README and package.json (author Shaun Wu, alexbay218; contributors Shad Amethyst - adri326, the notation specification's author - SnowmanFactory and Neathp: 'in the style of Chess.js'), and its code; no credit to or code from another rules implementation - its move generation, check test and mate search are its own JavaScript. Its own lineage. One shared origin: its 5DFEN board-string reader, src/fen.js, was written by Adrien Burgun (adri326; b8339d4, 2021-01-11) the day he wrote the notation parser's parse_5dfen (parsers/game.js, c09e3ea), and the two share their loop and error messages - so on records set up from 5DFEN boards they can share a bug. They have diverged since: Chess in 5D keeps the unmoved marker and maps even timelines its own way; the notation parser drops the marker and reads '-0' as a signed zero. The notation parser is parse-only and never counts towards the bar."
dependency_names = ["5d-chess-js"]
notes = [
    "Chess in 5D's client (gitlab.com/5d-chess/chess-in-5d, AGPL-3.0) takes its rules from this library (dependency 5d-chess-js ^1.2.1). Only the rules library is pinned; the client adds no rules.",
    "Runtime npm dependencies, all MIT: module-alias 2.2.2, blueimp-md5 2.18.0, present 1.0.0.",
    "Defects at the pin, and what the driver does about each without touching rules logic: inCheckmate and inStalemate answer true when their search runs out of time (the driver calls the search itself and reads its timed-out flag); that search can exhaust memory on wide positions (it runs in a worker with its own heap limit); a Board header the library does not know, or that its header reader does not match, is silently replayed on the Standard layout, and 5DFEN boards are ignored unless Board is custom (the driver asks the library which variant it set up and refuses the record when that is not the one declared); a PGN result token at the end of the move text is read as moves (it is dropped); chess.actions() throws in its 'object' and 'json' formats (a ReferenceError) and in '5dpgn' (a TypeError), and in every format passes its promotion pieces where boardFuncs.moves() takes its 'spatial moves only' switch, so it would list no move through time or across timelines (not used: the driver's observe --actions diagnostic calls actionFuncs.actions() itself, with that switch off).",
    "Its action enumeration yields ordered move sequences under its own options, so it contributes check and mate verdicts and move legality, not action counts.",
]

[repo.kairos]
role = "oracle"
tier = "nightly"
upstream = "FirePlank/5d-chess-engine"
url = "https://github.com/FirePlank/5d-chess-engine"
submodule = "oracle-kairos"
path = "oracles/third_party/kairos"
commit = "8bfea4a6e8d1cec2cc27cafa387b1bd78c0c94e0"
tree = "821600fbdf7e6b9228795255b3e722f35c829b11"
ref = "main"
committed = "2026-10-23"
licence = "GPL-3.0-only (LICENSE file: GitHub's GPL-3.0 template text; Cargo.toml: GPL-3.0-only); NOTICE: parts derived from ftxi/5dchess_engine under BSD-2-Clause"
licence_file = "LICENSE"
licence_sha256 = "589ed823e9a84c56feb95ac58e7cf384626b9cbf4fda2a907bc36e103de1bad2"
summary = "Kairos: a Rust 5D chess engine - rules up to 8x8 with the variant pieces, a hypercuboid legal-action search with an exhaustive one beside it, 5dpgn/5DFEN input, an alpha-beta player over 5DUCI (decision H52)"
used_as = "Built from an export of the pinned commit with the pinned Rust toolchain. Queried through oracles/drivers/kairos, a Rust program of the harness's own linked against the pinned crate as a library (it calls its 5dpgn reader, its replay, its check test, its mate test and its two action searches, and copies none of them), in one replay of the record. Its programs ask the same calls another way: the kairos binary plays over 5DUCI (position, go, print - no verdict or count); its developer tool ktools answers per position (perft: the hypercuboid count; naive: both searches' counts; rules: the boards, the check and the mate type) from position files of its own (G lines), which its pgn2g command writes from a 5dpgn file; and its JSON command interface (web::api) is a library API that only the WebAssembly build of its site calls. Those are the stock tools a driver check would hold the driver to (not built yet)."
lineage = "ftxi"
lineage_note = "Read at the pin (2026-11-01; corrected 2026-11-02): its NOTICE - 'Parts of the rules and legal-action code are derived from 5dchess_engine, Copyright (c) 2024-2026, ftxi, used under the BSD 2-Clause License', present since its first commit (ca828ce, 2026-10-15) - its LICENSE (GPL-3.0) and its code. Most of its src/core and src/misc mirror ftxi's modules (check_position, hypercuboid, geometry, integer_set, graph, ordering, vec4; its perft, prof and tactics have no ftxi counterpart, and some of ftxi's modules none in Kairos). Translated from ftxi's code: its 5dpgn reader ('ported from the C++ engine's pgnparser'); its mate test (State::get_mate_type_impl: ftxi's state.cpp, line by line); its exhaustive enumerator (core/naive.rs: ftxi's naive_search_impl, tools/search_tools.cpp); and its check test's pass set (CheckPosition::for_present, for_phantom_in, for_check_symbols - R1's reading), which is ftxi's later code, its commit f66c4ee ('check semantics revisited', 2026-10-15, after ftxi's pin, where for_phantom passes every timeline whose end is the mover's). Its seven hand-coded variant layouts are ftxi's - Standard, Turn Zero, Reversed Royalty and Very Small - Open as at ftxi's pin, Half Reflected, Defended Pawn and Two Timelines as in ftxi's later commit 95751dc - and its 37 others come from the notation repository's table. Its own: wasted-move pruning and its playing engine. Not code, so no lineage: its scripts/rules_check/compare.mjs diffs its moves and checks (and, with --js-mate, its mate status) against 5d-chess-js, added (c8750ef) after its check pass set (ca828ce). In ftxi's lineage (issue 526, ruled at CHECKPOINT 10): it counts with ftxi for the two-oracle bar."
dependency_names = ["kairos"]
notes = [
    "Pinned at the head of main: the repository has no tags and no releases. It was created on 2026-10-15 and had 354 commits by the pin (2026-10-23), most days several; a pin bump will move answers, and is reviewed as any other.",
    "Not independent of ftxi in most of what it does. Its NOTICE says parts of its rules and legal-action code are derived from ftxi/5dchess_engine (BSD-2-Clause); most of its src/core and src/misc mirror ftxi's modules (check_position, hypercuboid, geometry, integer_set, graph, ordering, vec4 - coordinates packed 12/12/4/4 bits, as ftxi's), and its 5dpgn reader says it is 'ported from the C++ engine's pgnparser'. Where it departs from ftxi at ftxi's pin it mostly follows ftxi's later code: its check test advances only the active timelines whose last board is in the present (State::has_phantom_check through CheckPosition::for_present) - R1's reading, and ftxi's own since its commit f66c4ee (2026-10-15), where ftxi at its pin advances every timeline whose end is the mover's - and three of its variant layouts are those of ftxi's later commit 95751dc. Its own departure is in its hypercuboid search, which leaves out actions that waste a move (below). Ruled at CHECKPOINT 10 (issue 526): one lineage with ftxi - it counts with ftxi for the two-oracle bar (H47), adding a vouch only where it answers and ftxi does not, and its disagreements still fail the gate.",
    "Its hypercuboid search does not generate an action that both branches and plays a 'wasted' move - a non-branching move whose boards all stay out of the present, other than boards a branch lands on - because dropping that move leaves an equally legal action (hypercuboid.rs, wasted_problem). Its perft therefore counts those actions out: its own test gives 31406 at depth 3 from the Standard start, 'the 1780 actions that waste a move (33186 with them)' left out. That is not the gate's count, so the hypercuboid source answers no count. Its exhaustive enumerator (core/naive.rs, naive_actions) lists every action - its non-branching moves once, in timeline order, and its branching moves in every order - the gate's definition; source kairos:naive counts with it.",
    "Its 5dpgn reader is all or nothing: one action of the main line or of any variation that it cannot match, or cannot submit, fails the whole record, with no position read. Such a record is reported unsupported from position 0 (reason parse_failed), never refused at action 0. The reader does not test royal safety; the driver replays the main line through its own referee (web::tree::play_action, which its game loader runs), and an action that leaves a royal capturable is refused there (cannot_submit, as the other oracles report it). That is the only refusal it can give: a move it cannot play, or an action that does not move the present, fails the record in the reader (parse_failed), so its legality answer covers royal safety alone.",
    "A line that ends in variations is replayed with its last variation as the main line (as ftxi's reader does); the adapter refuses such a record, with ftxi's guard. It reads the Board header (else Variant), Size, Timeline and Promotions; it refuses a Board it does not know rather than set up Standard. It knows 44 named variants: seven laid out by hand as ftxi lays them out (Standard, Standard - Turn Zero, Reversed Royalty and Very Small - Open as at ftxi's pin; Half Reflected, Defended Pawn and Two Timelines as in ftxi's later commit 95751dc), the other 37 taken from adri326/5dchess-notation's table. Its Half Reflected swaps white's king and queen (R*NBK*QBNR*), where the notation's table, Chess in 5D and cwmtt swap black's: that set-up, not the move text, is why it fails cwmtt/test1 at (0T5)Qd1>>(0T3)f3~ (its white queen is not on d1) - given the notation's layout as a custom 5DFEN board, it reads all 20 actions. Boards are 8x8 at most.",
    "Its .cargo/config.toml builds with -C target-cpu=native. The harness builds the driver outside the exported tree, where that file does not apply, so the build is the same on every x86-64 machine.",
]

[repo.notation]
role = "parse-oracle"
tier = "commit"
upstream = "adri326/5dchess-notation"
url = "https://github.com/adri326/5dchess-notation"
submodule = "corpus-notation"
path = "oracles/third_party/notation"
commit = "99f6163a9c95a6a9740b20fb5f3c7f6503a166a0"
tree = "a592a0ca229aeb508ac73e7c15f6a269f3ac051f"
ref = "master (v1.4.3-13)"
committed = "2021-07-25"
licence = "X11 (MIT-style, with a no-advertising clause)"
licence_file = "LICENSE"
licence_sha256 = "8d4c0ecb12b11ec195afed72693869a24cea48e8b160d2cc4b8f03d08f42a0ae"
summary = "The 5dpgn / 5dfen notation specification, with sample game records and a parser written beside it"
used_as = "The pinned text of the notation the corpus is written in, and a source of corpus records (test/*.5dpgn). Its bundled parser (parsers/pgn.js and parsers/game.js, which need no package) is exported at the pinned commit and run as a parse-only oracle through oracles/drivers/notation, in a separate Node process per record: at every position, the boards it holds and the side it reads as moving next, and how many actions it read - never a rules verdict."
lineage = "notation"
lineage_note = "Read at the pin (2026-11-01; corrected 2026-11-02): its LICENSE (X11, 'Copyright 2020, Adrien Burgun'), README, USAGE and its parser (parsers/pgn.js, parsers/game.js); no credit to or code from another implementation (its README lists 5d-chess-js's older notation as another notation, and parsers/alexbay.js reads that format). Its author wrote Chess in 5D's 5DFEN reader the same day as its parse_5dfen: the two share their loop and error messages, and have diverged since (see chessin5d). Parse-only (H26): its own lineage, which never counts towards the bar."
dependency_names = ["5dchess-notation"]
notes = [
    "Not in the design spec's table of rules oracles: pinned so the corpus has real game records that do not come from an oracle's own test suite, and so that the engine's parser is written from the specification (decision H28). Its bundled parser is a parse-only oracle (H26), and as off limits to the engine as everything else under third_party.",
    "The parser applies each move as written. It has no check, legality or end-of-game logic, and finds the moving piece with a movement test of its own only where the move text leaves the origin square out. So its acceptance of an action is no verdict - it accepts an action that leaves a king in check - and a move it cannot apply is a soft rejection.",
    "Defects at the pin, and what the harness does about each without touching the parser: it reports an error by printing it to stdout and calling process.exit(1) (the driver captures what it prints and turns the exit into an exception); a Board name it does not know gives one silently empty board, and a named layout is set up on boards of the Size header's size, or 8x8, never its own (both refused, by the adapter and again by the driver); it reads 5DFEN board strings only under Board \"custom\" (refused under any other); its tokeniser loops forever on a comment that is never closed (refused before it runs); it stores a 5DFEN \"-0\" board as a signed zero, which it writes back as \"0\" (left alone: a set-up that mixes it with \"+0\" is refused under a reason of its own, signed_zero, so that the recorded outcome names the defect; any other shows in the fingerprints); it drops the unmoved marker \"*\" (its state events say markers false); it splits a long-algebraic pawn move such as e2e4 into two moves (it then finds no pawn for the first, a soft rejection).",
    "X11 licence: the export the driver loads is the whole pinned tree, LICENSE included, in the harness cache, never committed or distributed; the project never uses the author's name to promote itself.",
]

# --- Toolchains -------------------------------------------------------------
# What builds the oracles. Compilers do not change rules logic, so these are
# pinned for reproducibility of the build, not of the verdicts.

[toolchain.ghc]
version = "9.10.3"
reason = "The compiler of Stackage lts-24.40, the resolver cwmtt's stack.yaml names at the pin. cwmtt needs only GHC's boot packages, so no package snapshot is fetched."

[toolchain.ghc.dist.windows-x86_64]
url = "https://downloads.haskell.org/~ghc/9.10.3/ghc-9.10.3-x86_64-unknown-mingw32.tar.xz"
sha256 = "ad17bdbee5f195d50024da1447f458071d9d8a34f90d76907c873abaf95d893f"

[toolchain.cmake]
min_version = "3.20"
bootstrap_pip = "cmake==4.4.3"
reason = "Configures ftxi's own CMake project and the harness driver built against it."

[toolchain.ninja]
bootstrap_pip = "ninja==1.13.2"
reason = "CMake generator: required on Windows, used elsewhere when present."

[toolchain.cxx]
requires = "g++ 13 or newer"
reason = "ftxi/5dchess_engine is C++23. Its own CI also builds with Apple Clang and MSVC 14.40; the harness looks only for g++ (set CXX to point at one)."

[toolchain.rust]
version = "1.99.0"
reason = "Builds the Kairos oracle's crate (edition 2024: Rust 1.85 or newer) and the harness's driver linked against it; the stable release of 2026-10-01, the newest at the pin. Kairos has no crate dependencies, so nothing is fetched from crates.io (the build runs --locked --offline). On Windows the GNU target, whose self-contained MinGW linker ships with the toolchain (rust-mingw) - no Visual Studio; on Linux rustc links with the system's cc."

# The component archives `build --bootstrap` merges into oracles/.cache/toolchains/rust-<version>
# (what rustup would install for the target, without rustup), each checked against its SHA-256.
[toolchain.rust.dist.windows-x86_64]
target = "x86_64-pc-windows-gnu"
components = [
    { url = "https://static.rust-lang.org/dist/rustc-1.99.0-x86_64-pc-windows-gnu.tar.xz", sha256 = "015f770c3ca0b3226a24fe159f30b03782a91679ba16159f7d83550f768fb795" },
    { url = "https://static.rust-lang.org/dist/cargo-1.99.0-x86_64-pc-windows-gnu.tar.xz", sha256 = "36dc7cba4be341c5a6cb3e10f660c4565b6f87f318d3cb87519b2cfe8c630bca" },
    { url = "https://static.rust-lang.org/dist/rust-std-1.99.0-x86_64-pc-windows-gnu.tar.xz", sha256 = "a2382bf189d5621e09db647da419a8e1d4c604d60941cb116da00ce34042b1dd" },
    { url = "https://static.rust-lang.org/dist/rust-mingw-1.99.0-x86_64-pc-windows-gnu.tar.xz", sha256 = "ad2b4b41362a99a86e20a8dbcec4be81b99f2d507f6408a72c7a139bc1919080" },
]

[toolchain.rust.dist.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
components = [
    { url = "https://static.rust-lang.org/dist/rustc-1.99.0-x86_64-unknown-linux-gnu.tar.xz", sha256 = "77171ba2a0345fdf2abc4fedda55d6de078dae7a68527c28be8c77dcc9604bd5" },
    { url = "https://static.rust-lang.org/dist/cargo-1.99.0-x86_64-unknown-linux-gnu.tar.xz", sha256 = "d7674918d28093097614cd9728b6ca60db9ea3038f640f0bd1e9a4188c7568ce" },
    { url = "https://static.rust-lang.org/dist/rust-std-1.99.0-x86_64-unknown-linux-gnu.tar.xz", sha256 = "3e58dff2d0b72196b5ea4e90536e174d400de88564a52694686b81e091169933" },
]

[toolchain.node]
min_version = "18"
reason = "Runs the Chess in 5D library, whose three pinned runtime dependencies npm installs from its own lockfile, and the notation repository's parser, which needs none."
