# Known divergences: places where an oracle is wrong and the engine is right.
#
# When the engine and an oracle disagree, the rulebook decides. If the engine is
# wrong, fix the engine. If the oracle is wrong, record it here - with the rule
# that settles it - and report it upstream. Any disagreement that is not recorded
# here fails the gate.
#
# An entry excuses exactly one observation: this oracle, at this pin, on this
# record, at this position, saying this, where the engine says that. It stops
# matching (and the gate fails) if either value changes, if the oracle's pin
# moves, or if the disagreement stops occurring. What it says the oracle answers
# is checked against the golden files. It is not a way to make a red gate green:
# an entry without a citation is rejected.
#
# The citation is to the rulebook - except where the notation specification
# settles it, and then it is cited instead: give `notation = "..."` in place of
# `rulebook`.
#
#   * A parse divergence (kind "placement"): the oracle set up different boards
#     from the engine's - other pieces, or the same pieces at other coordinates:
#     it read the record's move text, or its set-up, otherwise. That is always
#     the notation's to settle, and needs `notation`.
#   * A marker-only parse divergence (kind "unmoved"): the same boards and
#     pieces, marked unmoved differently. The notation's "5DFEN Strictness" says
#     which pieces carry the marker and the rulebook what having moved means:
#     either may settle it. Its index is the first position of a run of
#     positions whose markers differ, and it excuses that run; markers that part
#     again after agreeing need an entry of their own.
#   * An oracle that refuses an action because it could not match the move
#     text to a move (oracle_value "rejected:no_matching_move",
#     "rejected:ambiguous_move", "rejected:notation_mismatch" or
#     "rejected:unrecognised"), or that read a different number of actions
#     (kind "length"), may be stopped by notation it does not read and not by a
#     rule. If that is what it is, cite the notation specification. If the
#     oracle really does hold the move illegal, it is a rules matter after all
#     and needs the rulebook like any other.
#   * The engine refusing as unreadable text an oracle played, in either mode
#     (kind "legality", engine_value "rejected:unreadable", oracle_value
#     "accepted"), at the action it could not read - index 0 being the
#     record's set-up, its headers or board strings. Whether that text is valid
#     is the notation specification's to say: such an entry must cite it, never
#     the rulebook.
#
# Every entry is also a telltale (decision H34): an engine that comes to agree
# with the oracle's recorded error - by the comparison's own rule, so refusing
# an action the oracle wrongly refused for any reason counts - fails the gate,
# and the entry is never reported stale for it. Never remove an entry to make
# that finding go away.
#
# The first entries (2026-10-02) come from the engine's first gate runs, triaged
# against the rulebook and the CHECKPOINT 1 rulings (docs/rules/README.md R1-R7):
# ftxi's check verdicts that R1 rules wrong; Chess in 5D's two false checkmates
# and ftxi's missing Black two-timeline double step (the two defects drafted for
# upstream in docs/checkpoints/upstream/, recorded here as telltales, R7); record
# text the notation specification rules out, which the engine refuses and an
# oracle played; and oracles' own notation errors. Differences that rules Q4
# (moves after the present has shifted) explains await the project owner's
# ruling and have no entry. The engine is not yet configured in gate.toml.
#
# [[divergence]]
# id = "KD-0001"
# oracle = "chessin5d"            # the source that is wrong: ftxi | ftxi:naive | cwmtt | cwmtt:naive | chessin5d | notation
#                                 # (for kind legality or length: the implementation - ftxi | cwmtt | chessin5d | notation)
# pin = "ee403c80e8c132fc4d168f5b99ddd9b8fe5cc17b"   # that oracle's locked commit when this was verified
# record = "cwmtt/standard"       # corpus record id
# record_sha256 = "..."           # its sha256 in corpus/manifest.toml
# kind = "in_check"               # side | in_check | legal_actions | terminal | legality | length | placement | unmoved
# index = 13                      # position index (action number for legality and length; 0 is the set-up)
# engine_value = "True"           # both values exactly as the gate prints them (for placement and
# oracle_value = "False"          # unmoved: the hash with its counts, "<32 hex digits> (2 boards, 63 pieces)")
# rulebook = "..."                # the rule that settles it, and where it is stated
#                                 # (or, where the notation settles it - see above: notation = "...")
# upstream = "https://..."        # the report, or "unreported: <why>"
# added = "2026-10-01"
# notes = ""
schema = 1

