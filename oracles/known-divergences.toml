rulebook = "docs/rules/README.md R1 (register H36), with C6 and C7 as ruled by it: a royal is in check if, passing on all active boards in the present, the opponent could capture it from any of their playable boards; optional boards ahead of the present and boards on inactive timelines are not passed. R1 also says a capture that would branch into an inactive timeline counts - but the attacker here stands on a board of the side to move's that the pass leaves unplayed, so it is not on one of the opponent's playable boards and captures nothing. CHECKPOINT 1 cluster CHK-I2, rule question RQ4, answered 'no' by R1: ftxi passes every timeline the side to move may play (its phantom of every head on the mover's colour), so its 'check' here is wrong and Chess in 5D's 'no check' right."
