# Commit tier of the oracle gate (design spec 11.0, decision H27): on every push
# and pull request, check the boundary, the pins, the corpus and the golden
# observations, then run the per-commit oracles (ftxi/5dchess_engine, and the
# notation repository's parser, which is parse-only).
#
# The heavier oracles (cwmtt, Chess in 5D) run in oracle-nightly.yml.
name: oracle gate - commit tier

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-tier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Not recursive: the oracles' own submodules are not needed, and one
          # of them is declared with an SSH URL (see oracles/oracles.lock.toml).
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The notation repository's parser (a parse-only oracle) runs in every tier.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Static checks - pins, corpus, known divergences, boundary, provenance, golden files
        run: python oracles/harness.py verify --tracked-only

      # Restored and saved as separate steps, so that a build is kept even when a
      # later step of the same run fails.
      - name: Restore the ftxi build
        id: ftxi-cache
        uses: actions/cache/restore@v6
        with:
          path: oracles/.cache/build/ftxi
          key: oracle-ftxi-${{ runner.os }}-${{ hashFiles('oracles/oracles.lock.toml', 'oracles/drivers/ftxi/**', 'oracles/oracle_harness/build.py') }}

      # The notation parser's build is an export and one node call: not worth caching.
      - name: Build the per-commit oracles
        run: |
          python oracles/harness.py doctor
          python oracles/harness.py build --oracle ftxi --oracle notation

      - name: Save the ftxi build
        if: steps.ftxi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: oracles/.cache/build/ftxi
          key: ${{ steps.ftxi-cache.outputs.cache-primary-key }}

      - name: Harness self-tests
        run: python oracles/harness.py selftest

      # The engine under test (gate.toml's [engine] command is build/engine/t5d-gate).
      # Built before the gate, and checked to have changed nothing under oracles/:
      # the gate's own harness-modified check only sees changes made while it runs.
      - name: Build the engine's gate adapter
        run: |
          python engine/build.py --werror
          test -z "$(git status --porcelain -- oracles/)" || { git status --porcelain -- oracles/; echo "the engine build changed files under oracles/"; exit 1; }

      - name: Gate - commit tier
        run: python oracles/harness.py gate --tier commit --tracked-only

      - name: Keep the gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-gate-commit
          path: oracles/.cache/reports/
          if-no-files-found: ignore
