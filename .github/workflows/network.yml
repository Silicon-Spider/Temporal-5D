# The network stack (python/): lint it and run its tests on Linux whenever it
# changes. CPU only, with the PyTorch and NumPy versions the build was developed
# with; random weights throughout (no training run ever happens here).
name: network

on:
  push:
    paths:
      - "python/**"
      - "engine/**"
      - ".github/workflows/network.yml"
  pull_request:
    paths:
      - "python/**"
      - "engine/**"
      - ".github/workflows/network.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suite outgrew one hour-long job (about two hours on a runner by 2026-11): it runs
    # as four shards in parallel, each test file in exactly one, balanced by test count
    # (T5D_TEST_SHARD, tests/conftest.py); 90 minutes each, since a count is not a time.
    name: test (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install numpy==2.5.2 pytest ruff==0.16.5

      # The engine's shared library, for the binding's tests (python/tests/engine/).
      # They require it here (T5D_REQUIRE_ENGINE below): a library that is missing, or
      # that the binding refuses (a layout it does not mirror), fails the job instead of
      # skipping the tests. The library and two executables only, to keep the job
      # short: t5d-gate replays the records of the end-to-end games
      # (tests/engine/test_netplay.py), which skip without it, and t5d-audit reads a
      # game's decision log (tests/engine/test_decision_log.py), which fails without it.
      - name: Build the engine library, the gate adapter and the decision-log reader
        working-directory: .
        env:
          CXX: g++-13
        run: |
          cmake -S engine -B build/engine -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine --target t5d t5d-gate t5d-audit --parallel

      - name: Lint
        if: matrix.shard == 0
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        env:
          T5D_REQUIRE_ENGINE: "1"
          T5D_TEST_SHARD: "${{ matrix.shard }}/4"
        run: python -m pytest -q -p no:cacheprovider
