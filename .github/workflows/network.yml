# The network stack (python/): lint it and run its tests on Linux whenever it
# changes. CPU only, with the PyTorch and NumPy versions the build was developed
# with; random weights throughout (no training run ever happens here).
name: network

on:
  push:
    paths:
      - "python/**"
      - "engine/**"
      - ".github/workflows/network.yml"
  pull_request:
    paths:
      - "python/**"
      - "engine/**"
      - ".github/workflows/network.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install numpy==2.5.2 pytest ruff==0.16.5

      # The engine's shared library, for the binding's tests (python/tests/engine/);
      # without it they skip. Only the library target, to keep the job short.
      - name: Build the engine library
        working-directory: .
        env:
          CXX: g++-13
        run: |
          cmake -S engine -B build/engine -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine --target t5d --parallel

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: python -m pytest -q -p no:cacheprovider
