# Nightly and release tiers of the oracle gate (design spec 11.0, decision H27):
# all three rules oracles - ftxi/5dchess_engine, penteract/cwmtt and Chess in 5D -
# and the notation repository's parser (parse-only), over the whole pinned corpus.
#
#   nightly  every night, and on demand
#   release  before any generator release or proof-channel enablement: run it by
#            hand (workflow_dispatch, tier = release) or push a generator-v* tag.
#            It fails unless an engine was compared against the oracles and came
#            through at least one named variant (custom positions are evidence
#            about no variant).
#
# The oracle builds are cached, and the harness decides which of them are stale:
# `build --plan` names the tools the stale ones need, and only those are
# installed. The heavy toolchain is GHC, which only cwmtt's build needs - a
# cached, up-to-date cwmtt build runs without a compiler.
name: oracle gate - nightly and release tiers

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Gate tier to run
        type: choice
        options: [nightly, release]
        default: nightly
  push:
    tags:
      - "generator-v*"

permissions:
  contents: read

env:
  # A generator tag runs the release tier; the schedule runs nightly.
  TIER: ${{ github.event_name == 'push' && 'release' || inputs.tier || 'nightly' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # not recursive - see oracle-commit.yml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Static checks - pins, corpus, known divergences, boundary, provenance, golden files
        run: python oracles/harness.py verify --tracked-only

      # Restored and saved as separate steps, so that builds are kept even when a
      # later step of the same run fails. After a driver or recipe change, the
      # newest older cache is restored: it still holds the builds the change did
      # not touch, and the harness rebuilds only the stale ones.
      - name: Restore the oracle builds
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: oracles/.cache/build
          key: oracle-builds-${{ runner.os }}-${{ hashFiles('oracles/oracles.lock.toml', 'oracles/drivers/**', 'oracles/oracle_harness/build.py') }}
          restore-keys: |
            oracle-builds-${{ runner.os }}-

      - name: Which build tools the stale builds need
        id: plan
        run: python oracles/harness.py build --plan | tee -a "$GITHUB_OUTPUT"

      # Must be exactly the version pinned in oracles/oracles.lock.toml
      # ([toolchain.ghc]); the harness refuses any other.
      - name: Install GHC (only when a stale build needs it)
        if: contains(format(',{0},', steps.plan.outputs.tools), ',ghc,')
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          enable-stack: false
          cabal-update: false

      - name: Build every oracle
        run: |
          python oracles/harness.py doctor
          python oracles/harness.py build

      - name: Save the oracle builds
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: oracles/.cache/build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Harness self-tests
        run: python oracles/harness.py selftest

      # The engine under test (gate.toml's [engine] command is build/engine/t5d-gate).
      # Built before the gate, and checked to have changed nothing under oracles/:
      # the gate's own harness-modified check only sees changes made while it runs.
      - name: Build the engine's gate adapter
        run: |
          python engine/build.py --werror
          test -z "$(git status --porcelain -- oracles/)" || { git status --porcelain -- oracles/; echo "the engine build changed files under oracles/"; exit 1; }

      - name: Gate - ${{ env.TIER }} tier
        run: python oracles/harness.py gate --tier "$TIER" --tracked-only

      - name: Keep the gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-gate-${{ env.TIER }}
          path: oracles/.cache/reports/
          if-no-files-found: ignore
